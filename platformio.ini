[platformio]
default_envs = waveshare_touch_35_c

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_ARCH_ESP32
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude

build_src_filter =
    +<main.cpp>
    +<esp32_nrf24_jammer/esp32_nrf24_jammer.cpp>
    +<esp32_nrf24_jammer/NRF24L01.cpp>
    +<esp32_nrf24_jammer/WaveshareTouchUI.cpp>
    -<esp32_nrf24_jammer/WiFiController.cpp>

lib_deps =
    moononournation/GFX Library for Arduino @ 1.5.5
    lewisxhe/SensorLib @ ^0.4.0
    robtillaart/TCA9554 @ ^0.1.3

monitor_speed = 921600
monitor_port = COM9
monitor_rts = 0
monitor_dtr = 0

[env:waveshare_touch_35_c]
build_flags =
    ${env.build_flags}
    -DWAVESHARE_TOUCH_35_C=1

[env:esp32dev]
build_flags =
    ${env.build_flags}
    -DLEGACY_ESP32DEV_BUILD=1
